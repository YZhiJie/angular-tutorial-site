<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <!-- Header -->
  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.12</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Angular 内部那点事</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Panel 1: 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：Zone.js 到处挂钩</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="410" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">为什么一改 async 就变慢？</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">Zone.js 猴子补丁把 setProm 全给包了一层。</text>

    <!-- Code chip -->
    <rect x="24" y="152" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// Zone.js 旧世界：补丁到处挂钩</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">setTimeout -&gt; patched setProm -&gt; asyncTaskId</text>
    <text x="38" y="214" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">fetch -&gt; patched Promise -&gt; microTaskId</text>
    <text x="38" y="234" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">XHR -&gt; patched EventTarget -&gt; macroTask</text>
    <text x="38" y="252" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">每个回调后都触发全局 change detection</text>

    <!-- 底部总结 -->
    <rect x="24" y="264" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="264" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="286" font-size="13.5" fill="#e2e8f0">旧版 Zone.js 隐式兜住一切异步，</text>
    <text x="40" y="306" font-size="13.5" fill="#94a3b8">回调结束后触发全量扫描。</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">Angular 22 zoneless 把这层拿掉了。</text>
  </g>

  <!-- Panel 2: 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：zoneless 三条路径</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">zoneless 下只有三条路径能触发刷新：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">signal 写入、模板事件、显式 markForCheck。</text>

    <!-- Three trigger paths -->
    <rect x="32" y="150" width="508" height="54" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="46" cy="177" r="8" fill="#22d3ee" opacity="0.3"/>
    <text x="46" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">①</text>
    <text x="66" y="177" font-size="13" fill="#e2e8f0">signal 写入 → 标记依赖消费者为脏</text>
    <text x="66" y="194" font-size="11" fill="#94a3b8">→ 调度器异步安排 → 向上标记祖先 → 检查被标记视图</text>

    <rect x="32" y="212" width="508" height="38" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <circle cx="46" cy="231" r="8" fill="#a78bfa" opacity="0.3"/>
    <text x="46" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">②</text>
    <text x="66" y="231" font-size="13" fill="#e2e8f0">模板事件绑定 → 当前组件视图标记为脏 → 同路径</text>

    <rect x="32" y="258" width="508" height="38" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <circle cx="46" cy="277" r="8" fill="#f472b6" opacity="0.3"/>
    <text x="46" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">③</text>
    <text x="66" y="277" font-size="13" fill="#e2e8f0">markForCheck() → 从当前视图到根路径打脏标记</text>

    <rect x="24" y="304" width="524" height="38" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="304" width="4" height="38" rx="2" fill="#a78bfa"/>
    <text x="40" y="326" font-size="13.5" fill="#e2e8f0">三条路径最终都汇合到同一套调度，而非全量扫描。</text>
  </g>

  <!-- Panel 3: 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：刷新路径对比</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Zone.js patched API vs signal 写入，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">结果完全不同：一个刷新一个不。</text>

    <!-- Compare chart -->
    <rect x="32" y="150" width="240" height="178" rx="8" fill="#111a30" stroke="#DD0031" stroke-opacity="0.6"/>
    <text x="152" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#DD0031">Zone.js 时代</text>
    <line x1="44" y1="178" x2="260" y2="178" stroke="#DD0031" stroke-opacity="0.2"/>
    <text x="46" y="198" font-size="12" fill="#94a3b8">setTimeout(plain++)</text>
    <text x="46" y="216" font-size="11" fill="#34d399">✅ patched → 全量 scan 刷新</text>
    <text x="46" y="240" font-size="12" fill="#94a3b8">fetch(...).then(plain++)</text>
    <text x="46" y="258" font-size="11" fill="#34d399">✅ Promise patched → 刷新</text>
    <text x="46" y="282" font-size="12" fill="#94a3b8">setInterval(plain++)</text>
    <text x="46" y="300" font-size="11" fill="#34d399">✅ patched → 每次都全量刷新</text>

    <rect x="300" y="150" width="240" height="178" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="420" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">zoneless (Angular 22)</text>
    <line x1="312" y1="178" x2="528" y2="178" stroke="#22d3ee" stroke-opacity="0.2"/>
    <text x="314" y="198" font-size="12" fill="#94a3b8">setTimeout(plain++)</text>
    <text x="314" y="216" font-size="11" fill="#DD0031">❌ 没通知 → 不刷新</text>
    <text x="314" y="240" font-size="12" fill="#94a3b8">fetch(...).then(reactive.update)</text>
    <text x="314" y="258" font-size="11" fill="#34d399">✅ signal 写入 → 局部刷新</text>
    <text x="314" y="282" font-size="12" fill="#94a3b8">markForCheck()</text>
    <text x="314" y="300" font-size="11" fill="#34d399">✅ 手动打脏 → 下轮刷新</text>
  </g>

  <!-- Panel 4: 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：内部原理小结</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">注入器树、指令树、脏标记——</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">框架行为可以用最小实验验证。</text>

    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">setTimeout 里改普通字段页面不动：没通知调度器</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">detectChanges 只刷当前视图，祖先模板仍旧不变</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">组件级 provider 不遮蔽兄弟，只遮蔽子树</text>

    <!-- 码叔总结 -->
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">Zone.js 是可选补丁层，signal 和事件才是 zoneless 的两条腿。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.12</text>
</svg>
