<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg6)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.06</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad6)">RxJS 流过你的代码</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad6)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：旧结果覆盖新的</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="62" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">我快速输入 angular，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">旧请求晚回来覆盖了新结果！</text>
    <rect x="24" y="152" width="524" height="114" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#f97316" font-family="'SF Mono',Consolas,monospace">// ❌ 朴素写法：每敲一字发一次</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">input(event) {</text>
    <text x="38" y="214" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  this.http.get(url + event.value)</text>
    <text x="38" y="232" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    .subscribe(r =&gt; this.users.set(r));</text>
    <text x="38" y="250" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="270" font-size="11.5" fill="#f97316">请求 1 慢回来 → 覆盖了请求 7 的结果</text>
    <rect x="24" y="282" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="56" rx="2" fill="#22d3ee"/>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">问题不是"怎么发请求"，而是三件事：</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">少发（防抖去重）· 只认最新（switchMap）· 失败可恢复</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：管道链</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">Subject 收事件 → 管道链 → 写入 signal</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">signal 渲染，Subject 管事件流</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">this.term$</text>
    <text x="148" y="174" font-size="12.5" fill="#94a3b8">  // Subject：事件入口</text>
    <text x="38" y="194" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">  .pipe(</text>
    <text x="38" y="214" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    debounceTime(300),</text>
    <text x="38" y="232" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    distinctUntilChanged(),</text>
    <text x="38" y="250" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">    switchMap(term =&gt;</text>
    <text x="50" y="266" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">      svc.search(term)),</text>
    <text x="38" y="282" font-size="12.5" fill="#DD0031" font-family="'SF Mono',Consolas,monospace">    takeUntilDestroyed(destroy),</text>
    <text x="38" y="298" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">  )</text>
    <rect x="24" y="280" width="524" height="2" fill="#22d3ee" opacity="0.2"/>
    <rect x="24" y="298" width="162" height="26" rx="8" fill="#111a30" stroke="#7dd3fc" stroke-opacity="0.5"/>
    <text x="38" y="316" font-size="11" fill="#7dd3fc">debounceTime 等待停顿</text>
    <rect x="192" y="298" width="162" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="206" y="316" font-size="11" fill="#a78bfa">distinctUntilChanged 去重</text>
    <rect x="360" y="298" width="188" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="374" y="316" font-size="11" fill="#f472b6">switchMap 取消旧请求</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：switchMap 时间线</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">switchMap 收到新值立刻退订旧流：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">旧 HTTP 请求被 abort，不会回写覆盖</text>
    <line x1="40" y1="220" x2="540" y2="220" stroke="#223055" stroke-width="2"/>
    <text x="40" y="215" font-size="11" fill="#64748b">时间 →</text>
    <rect x="60" y="170" width="90" height="44" rx="4" fill="#111a30" stroke="#f97316" stroke-width="1.5"/>
    <text x="105" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">输入 a</text>
    <text x="105" y="204" text-anchor="middle" font-size="10" fill="#94a3b8">发请求 A</text>
    <rect x="200" y="170" width="110" height="44" rx="4" fill="#111a30" stroke="#DD0031" stroke-width="1.5"/>
    <text x="255" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#DD0031">输入 angular</text>
    <text x="255" y="204" text-anchor="middle" font-size="10" fill="#94a3b8">发请求 B</text>
    <rect x="360" y="250" width="140" height="32" rx="4" fill="#111a30" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="430" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">B 完成 → 写入</text>
    <text x="220" y="288" font-size="12" fill="#f97316">✗ A 被 abort，永远不会回写</text>
    <path d="M 150 188 L 200 188" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowX)"/>
    <defs><marker id="arrowX" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f97316"/></marker></defs>
    <rect x="24" y="296" width="524" height="56" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="316" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// catchError 放内层，失败不终止整条搜索流</text>
    <text x="38" y="334" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">switchMap(t =&gt; svc.search(t).pipe(</text>
    <text x="50" y="350" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  catchError(() =&gt; of([]))</text>
    <text x="50" y="366" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">))</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：映射选择</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="360" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">旧任务是否有意义 → 决定用哪个 Map</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">takeUntilDestroyed 自动解绑订阅</text>
    <rect x="24" y="138" width="168" height="22" rx="4" fill="#111a30" stroke="#f472b6" stroke-width="1.5"/>
    <text x="108" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#f472b6">switchMap：只认最新</text>
    <rect x="202" y="138" width="168" height="22" rx="4" fill="#111a30" stroke="#34d399" stroke-width="1.5"/>
    <text x="286" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#34d399">mergeMap：全保留并发</text>
    <rect x="380" y="138" width="168" height="22" rx="4" fill="#111a30" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="464" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbbf24">concatMap：排队串行</text>
    <rect x="24" y="176" width="524" height="12" rx="2" fill="#223055"/>
    <rect x="24" y="196" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="242" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="251" font-size="14" fill="#e2e8f0">catchError 放外层——一次失败整条搜索流就死了</text>
    <rect x="32" y="270" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="279" font-size="14" fill="#e2e8f0">没有 takeUntilDestroyed——组件销毁后还在写 signal</text>
    <rect x="32" y="298" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="307" font-size="14" fill="#e2e8f0">finalize 被取消请求时也会执行——loading 闪断</text>
    <rect x="24" y="320" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="320" width="4" height="40" rx="2" fill="#DD0031"/>
    <text x="40" y="339" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="140" y="339" font-size="13.5" fill="#e2e8f0">RxJS 让数据流变得可组合、可取消、可恢复。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.06</text>
</svg>
