<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg8)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.08</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad8)">把代码关进测试笼子</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad8)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：视图没变</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="440" height="62" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">测试里改了 signal，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">为啥 nativeElement 还是旧值？</text>
    <rect x="24" y="152" width="524" height="114" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#f97316" font-family="'SF Mono',Consolas,monospace">// ❌ 忘记触发变更检测</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const fixture = TestBed.createComponent(App);</text>
    <text x="38" y="214" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fixture.componentRef.items.set([...]);</text>
    <text x="38" y="234" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">expect(fixture.nativeElement.textContent)</text>
    <text x="50" y="250" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  .toContain('1655'); // ❌ 失败</text>
    <text x="38" y="270" font-size="11" fill="#f97316">zoneless 下 signal 变了不会自动刷新模板！</text>
    <rect x="24" y="282" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="56" rx="2" fill="#22d3ee"/>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">fixture.detectChanges() 显式触发一次变更检测；</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">signal 变化检测是异步的，fakeAsync + tick 可控制。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：两个维度</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">先让逻辑可测，再谈怎么测：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">纯函数打底，TestBed 只在必要时用</text>
    <rect x="24" y="148" width="248" height="86" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="38" y="168" font-size="12.5" font-weight="bold" fill="#34d399">① 纯函数测试：基线</text>
    <text x="38" y="186" font-size="11" fill="#94a3b8">· 无 DI、无 DOM、无 signal</text>
    <text x="38" y="202" font-size="11" fill="#94a3b8">· 输入确定则输出确定</text>
    <text x="38" y="218" font-size="11" fill="#94a3b8">· 一条断言 = 一个业务规则</text>
    <text x="38" y="234" font-size="10.5" fill="#7dd3fc">· 运行快、稳定、直接</text>
    <rect x="284" y="148" width="264" height="86" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="298" y="168" font-size="12.5" font-weight="bold" fill="#f472b6">② TestBed：只在必要时</text>
    <text x="298" y="186" font-size="11" fill="#94a3b8">· 验证 DI 注入是否正确</text>
    <text x="298" y="202" font-size="11" fill="#94a3b8">· 验证模板绑定 / DOM 事件</text>
    <text x="298" y="218" font-size="11" fill="#94a3b8">· 验证 signal → computed → 模板链路</text>
    <text x="298" y="234" font-size="10.5" fill="#7dd3fc">· 慢且脆弱，少用</text>
    <rect x="24" y="244" width="524" height="60" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="266" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 纯函数测试——不需要任何 Angular 运行时</text>
    <text x="38" y="286" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">expect(subtotal([])).toBe(0);</text>
    <text x="38" y="302" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">expect(() =&gt; applyDiscount(100, 1.2))</text>
    <text x="50" y="318" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  .toThrow(RangeError);</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：两种写法</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">syncTestBed vs standalone component 对比：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">detectChanges + fakeAsync + tick 三件套</text>
    <rect x="24" y="148" width="250" height="190" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="38" y="168" font-size="11.5" font-weight="bold" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 同步 TestBed</text>
    <text x="38" y="186" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">import { fakeAsync, tick };</text>
    <text x="38" y="204" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">it('更新后刷新', fakeAsync(() =&gt; {</text>
    <text x="50" y="220" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  const f = TestBed.createComponent(App);</text>
    <text x="50" y="236" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  f.detectChanges(); // 首次</text>
    <text x="50" y="252" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  f.items.set(newList);</text>
    <text x="50" y="268" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  tick(); // 跑 async task</text>
    <text x="50" y="284" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  f.detectChanges(); // 刷新</text>
    <text x="50" y="300" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  expect(f.nativeElement)</text>
    <text x="50" y="316" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">    .toContain('1655');</text>
    <text x="38" y="332" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">}));</text>
    <rect x="276" y="148" width="272" height="190" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="290" y="168" font-size="11.5" font-weight="bold" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// HttpClientTestingModule</text>
    <text x="290" y="186" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">TestBed.configureTestingModule({</text>
    <text x="302" y="202" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  imports: [HttpClientTestingModule],</text>
    <text x="302" y="218" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  providers: [UserService]</text>
    <text x="290" y="234" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">});</text>
    <text x="290" y="250" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">const http = TestBed.inject(</text>
    <text x="302" y="266" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  HttpTestingController);</text>
    <text x="290" y="282" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// http.expectOne(...).flush(data)</text>
    <text x="290" y="300" font-size="10.5" fill="#94a3b8">✓ 无网络请求，可控的假响应</text>
    <text x="290" y="316" font-size="10.5" fill="#94a3b8">✓ 验证请求 URL / method / body</text>
    <text x="290" y="332" font-size="10.5" fill="#94a3b8">✓ 验证取消请求也被捕获</text>
  </g>

  <g transform="translate(608,462)">
