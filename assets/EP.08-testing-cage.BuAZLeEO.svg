    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：测试金字塔</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">金字塔底座是纯函数，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">TestBed 组件测试覆盖关键交互</text>
    <polygon points="200,138 372,138 412,232 160,232" fill="#111a30" stroke="#22d3ee" stroke-width="2"/>
    <text x="286" y="168" text-anchor="middle" font-size="11" fill="#22d3ee">少量 TestBed 组件测试</text>
    <text x="286" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">覆盖 signal→模板链路</text>
    <text x="286" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">DI 注入、DOM 事件</text>
    <polygon points="160,232 412,232 452,326 120,326" fill="#111a30" stroke="#34d399" stroke-width="2"/>
    <text x="286" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">大量纯函数测试</text>
    <text x="286" y="284" text-anchor="middle" font-size="11" fill="#94a3b8">覆盖业务规则、边界条件</text>
    <text x="286" y="300" text-anchor="middle" font-size="11" fill="#94a3b8">运行毫秒级，稳定</text>
    <text x="286" y="316" text-anchor="middle" font-size="11" fill="#94a3b8">Vitest describe/it/expect</text>
    <rect x="24" y="336" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="130" y="342" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="150" y="351" font-size="14" fill="#e2e8f0">测试全绿但线上出错——只覆盖正常路径</text>
    <rect x="340" y="342" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="360" y="351" font-size="14" fill="#e2e8f0">浮点断言用 toBeCloseTo 而非 toBe</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.08</text>
