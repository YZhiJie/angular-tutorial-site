<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.04</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">路由门卫与响应式表单</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 第一格 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：守卫返回 Observable</text>
    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,-3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="430" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">canActivate 要等登录态，</text>
    <text x="102" y="126" font-size="15" fill="#DD0031">页面先闪了一下白屏…怎么回事？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 守卫返回 Observable<boolean></text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">canActivate = (_, state) => this.auth.isLoggedIn$</text>
    <text x="38" y="214" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// ✅ 路由自动订阅并等待首个值</text>
    <text x="38" y="232" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 不 emit 就不进，emit false 就挡</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">Router 会自动消费 Promise / Observable，等你。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">白屏不是守卫的锅——是组件首屏渲染。</text>
  </g>

  <!-- 第二格 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：守卫顺序 + 自动等待</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">canActivate 从父到子串行执行。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">全部放行才进组件，一个 false 就挡。</text>
    <!-- 守卫执行顺序图 -->
    <rect x="24" y="150" width="120" height="44" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="84" y="170" text-anchor="middle" font-size="11" fill="#a78bfa" font-weight="bold">① 父 canActivate</text>
    <text x="84" y="186" text-anchor="middle" font-size="10" fill="#94a3b8">async / 同步</text>
    <text x="148" y="172" font-size="18" fill="#a78bfa">→</text>
    <rect x="170" y="150" width="120" height="44" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="230" y="170" text-anchor="middle" font-size="11" fill="#f472b6" font-weight="bold">② 子 canActivate</text>
    <text x="230" y="186" text-anchor="middle" font-size="10" fill="#94a3b8">同上</text>
    <text x="294" y="172" font-size="18" fill="#f472b6">→</text>
    <rect x="316" y="150" width="120" height="44" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="376" y="170" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="bold">③ resolve 数据</text>
    <text x="376" y="186" text-anchor="middle" font-size="10" fill="#94a3b8">预加载</text>
    <text x="440" y="172" font-size="18" fill="#22d3ee">→</text>
    <rect x="462" y="150" width="100" height="44" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="512" y="172" text-anchor="middle" font-size="11" fill="#34d399" font-weight="bold">④ 渲染</text>
    <rect x="24" y="208" width="524" height="120" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="230" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">// 守卫三种返回值 Router 都能处理</text>
    <text x="38" y="250" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">boolean            → 立即判断</text>
    <text x="38" y="268" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">Promise&lt;boolean&gt; → 等 resolve</text>
    <text x="38" y="286" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">Observable&lt;boolean&gt; → 等首个 emit</text>
    <text x="38" y="304" font-size="12.5" fill="#f97316" font-family="'SF Mono',Consolas,monospace">// 守卫永远不 resolve → 路由挂起</text>
  </g>

  <!-- 第三格 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：FormGroup 树 + 跨字段校验</text>
    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="430" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">ReactiveFormsModule vs FormsModule：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">前者代码驱动，后者模板驱动。</text>
    <rect x="24" y="150" width="524" height="138" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// FormBuilder.nonNullable.group</text>
    <text x="38" y="190" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">this.fb.nonNullable.group({</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  email: ['', [Validators.required]],</text>
    <text x="38" y="222" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  password: ['', [Validators.minLength(8)]],</text>
    <text x="38" y="238" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  confirm: ['', Validators.required],</text>
    <text x="38" y="254" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}, { validators: passwordMatch() })</text>
    <text x="38" y="276" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 跨字段校验器挂在 group 上</text>
    <rect x="24" y="296" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="44" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">nonNullable 让值类型收敛为 string，模板里不用判 null。</text>
    <text x="40" y="332" font-size="13.5" fill="#94a3b8">patchValue 只覆盖传入字段，setValue 要求全量。</text>
  </g>

  <!-- 第四格 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：门卫与表单最佳实践</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="430" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Router 自动等守卫，FormBuilder 管模型。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">错误展示靠 touched + hasError。</text>
    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">routerLink 换 href 整页刷新 → 用 routerLink 站内导航</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">通配路由写前面抢其他页 → **放最后**</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">提交了看不到错误 → 调 form.markAllAsTouched()</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">守卫决定能不能进，表单决定用户怎么填。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.04</text>
</svg>
