<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg7)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.07</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad7)">懒加载怎么瘦体积</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad7)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：首屏 2MB</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="62" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">首屏加载 2MB！为啥 RxJS 就占了 300KB？</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">报表页明明没打开，怎么也在主包里？</text>
    <rect x="32" y="152" width="170" height="60" rx="8" fill="#111a30" stroke="#f97316" stroke-width="2"/>
    <text x="117" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316">main.js</text>
    <rect x="40" y="180" width="154" height="10" rx="2" fill="#1e2a44"/>
    <rect x="40" y="180" width="140" height="10" rx="2" fill="#DD0031"/>
    <text x="117" y="196" text-anchor="middle" font-size="10" fill="#e2e8f0">1.8 MB 😱</text>
    <rect x="218" y="152" width="130" height="60" rx="8" fill="#111a30" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="283" y="172" text-anchor="middle" font-size="11" fill="#22d3ee">RxJS</text>
    <rect x="226" y="180" width="114" height="10" rx="2" fill="#1e2a44"/>
    <rect x="226" y="180" width="60" height="10" rx="2" fill="#22d3ee"/>
    <text x="283" y="196" text-anchor="middle" font-size="10" fill="#94a3b8">300 KB</text>
    <rect x="364" y="152" width="184" height="60" rx="8" fill="#111a30" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="456" y="172" text-anchor="middle" font-size="11" fill="#a78bfa">Reports 组件</text>
    <rect x="372" y="180" width="168" height="10" rx="2" fill="#1e2a44"/>
    <rect x="372" y="180" width="80" height="10" rx="2" fill="#a78bfa"/>
    <text x="456" y="196" text-anchor="middle" font-size="10" fill="#94a3b8">不该在这里</text>
    <rect x="24" y="226" width="524" height="62" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="248" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// patch 模式：全部操作符一次性打包进来</text>
    <text x="38" y="266" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">import 'rxjs/add/operator/map';</text>
    <text x="38" y="284" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// pipeable：只用你 import 的</text>
    <text x="38" y="300" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">import { map, switchMap } from 'rxjs/operators';</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三种手段</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">首屏体积 = 静态引用图决定</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">不是"写在哪个文件里"，而是"谁 import 了它"</text>
    <rect x="24" y="148" width="164" height="56" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="38" y="168" font-size="11.5" font-weight="bold" fill="#22d3ee">① loadComponent</text>
    <text x="38" y="184" font-size="10" fill="#94a3b8">路由级懒加载</text>
    <text x="38" y="198" font-size="10" fill="#94a3b8">按页面拆 chunk</text>
    <rect x="196" y="148" width="164" height="56" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="210" y="168" font-size="11.5" font-weight="bold" fill="#f472b6">② @defer</text>
    <text x="210" y="184" font-size="10" fill="#94a3b8">区块级延迟加载</text>
    <text x="210" y="198" font-size="10" fill="#94a3b8">on idle / interaction</text>
    <rect x="368" y="148" width="168" height="56" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="382" y="168" font-size="11.5" font-weight="bold" fill="#f97316">③ OnPush + signal</text>
    <text x="382" y="184" font-size="10" fill="#94a3b8">减少运行时检查</text>
    <text x="382" y="198" font-size="10" fill="#94a3b8">不直接减体积</text>
    <rect x="24" y="212" width="524" height="88" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="234" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 路由懒加载：动态 import 是分包边界</text>
    <text x="38" y="254" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">{ path: 'reports', loadComponent: () =&gt;</text>
    <text x="50" y="270" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">  import('./reports').then(m =&gt; m.Reports)</text>
    <text x="50" y="286" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">)}</text>
    <text x="38" y="304" font-size="11" fill="#f97316">⚠ 只有动态 import() 才能分包，静态 import 仍进主包</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：前后对比</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="340" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">ng build 前后主包体积对比：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">懒加载 + @defer → 砍一半</text>
    <text x="40" y="158" font-size="12" font-weight="bold" fill="#f97316">构建前：</text>
    <rect x="110" y="146" width="420" height="20" rx="4" fill="#1e2a44"/>
    <rect x="110" y="146" width="420" height="20" rx="4" fill="#DD0031"/>
    <text x="535" y="161" text-anchor="end" font-size="11" fill="#e2e8f0">2.0 MB</text>
    <text x="40" y="186" font-size="12" font-weight="bold" fill="#34d399">构建后：</text>
    <rect x="110" y="174" width="420" height="20" rx="4" fill="#1e2a44"/>
    <rect x="110" y="174" width="210" height="20" rx="4" fill="#22d3ee"/>
    <text x="535" y="189" text-anchor="end" font-size="11" fill="#e2e8f0">980 KB</text>
    <text x="40" y="214" font-size="12" fill="#94a3b8">↓ Reports chunk 单独加载 450 KB</text>
    <text x="40" y="232" font-size="12" fill="#94a3b8">↓ Stats chunk (@defer) 180 KB 空闲时加载</text>
    <rect x="24" y="248" width="524" height="98" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="270" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// angular.json 预算配置</text>
    <text x="38" y="290" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">"budgets": [</text>
    <text x="50" y="308" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  { "type": "initial",</text>
    <text x="62" y="324" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">    "maximumWarning": "500kB",</text>
    <text x="62" y="340" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">    "maximumError": "1MB" },</text>
    <text x="50" y="356" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">]</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：瘦体积守则</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">静态 import 决定主包；</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">动态 import() + @defer + 预算三合一</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">@defer 里的组件在块外也被静态 import——留在主包</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">直接刷新懒路由返回 404——配 SPA history fallback</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">OnPush 下原地改数组——没有新引用不触发检查</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="140" y="311" font-size="13.5" fill="#e2e8f0">首屏瘦不瘦，构建产物说了算。</text>
    <text x="140" y="329" font-size="13.5" fill="#94a3b8">别凭感觉，打开 dist 看 chunk 结构。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.07</text>
</svg>
