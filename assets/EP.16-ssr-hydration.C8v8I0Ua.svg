<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <!-- Header -->
  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.16</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">服务端先画一遍</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Panel 1: 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：首屏白、水合闪</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="440" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">首屏白屏两秒，水合后又闪一下，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">点击还偶尔没反应。</text>

    <!-- Flow -->
    <rect x="32" y="154" width="508" height="96" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="46" y="176" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">请求 → 服务端渲染 HTML → 浏览器先显示</text>
    <text x="46" y="198" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">→ 下载 JS → 水合 → 接管交互</text>
    <text x="46" y="222" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">任何一步不一致：闪烁、丢事件、重复请求</text>
    <text x="46" y="242" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 白屏 = 还没 HTML；闪 = 两份 DOM 不一致</text>

    <!-- 底部总结 -->
    <rect x="24" y="264" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="264" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="286" font-size="13.5" fill="#e2e8f0">SSR 的收益是首屏内容与 SEO，</text>
    <text x="40" y="306" font-size="13.5" fill="#94a3b8">代价是「服务端与浏览器必须画同一份」；</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">不一致就会以闪烁和丢事件的形式出现。</text>
  </g>

  <!-- Panel 2: 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：一份代码三个入口</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">业务代码只有一份，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">入口分成三个。</text>

    <!-- Three entries -->
    <rect x="32" y="148" width="508" height="40" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="167" font-size="12.5" font-weight="bold" fill="#22d3ee">main.ts</text>
    <text x="118" y="167" font-size="11.5" fill="#94a3b8">浏览器启动，bootstrapApplication</text>
    <text x="46" y="182" font-size="11" fill="#475569">src/main.ts</text>

    <rect x="32" y="198" width="508" height="40" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="46" y="217" font-size="12.5" font-weight="bold" fill="#a78bfa">main.server.ts</text>
    <text x="150" y="217" font-size="11.5" fill="#94a3b8">服务端引导，bootstrapApplication</text>
    <text x="46" y="232" font-size="11" fill="#475569">src/main.server.ts</text>

    <rect x="32" y="248" width="508" height="40" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="46" y="267" font-size="12.5" font-weight="bold" fill="#f472b6">server.ts</text>
    <text x="118" y="267" font-size="11.5" fill="#94a3b8">HTTP 服务器，调 AngularNodeAppEngine</text>
    <text x="46" y="282" font-size="11" fill="#475569">src/server.ts</text>

    <!-- Import -->
    <rect x="24" y="300" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="44" rx="2" fill="#a78bfa"/>
    <text x="40" y="320" font-size="13" fill="#e2e8f0">angular.json：server + ssr.entry + outputMode: server</text>
    <text x="40" y="338" font-size="12" fill="#94a3b8">构建出 browser/ 与 server/ 两套产物。</text>
  </g>

  <!-- Panel 3: 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：平台差异与水合一致</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="440" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">服务端没有 window，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">浏览器要先拿数据再水合。</text>

    <!-- Table -->
    <rect x="24" y="150" width="524" height="28" rx="6" fill="#111a30" stroke="#1e2a44"/>
    <text x="36" y="169" font-size="12" font-weight="bold" fill="#22d3ee">场景</text>
    <text x="210" y="169" font-size="12" font-weight="bold" fill="#22d3ee">服务端</text>
    <text x="360" y="169" font-size="12" font-weight="bold" fill="#22d3ee">浏览器</text>

    <text x="36" y="196" font-size="12" fill="#e2e8f0">window / document</text>
    <text x="210" y="196" font-size="11" fill="#DD0031">✗ 不存在</text>
    <text x="360" y="196" font-size="11" fill="#34d399">✓ 可用</text>

    <text x="36" y="220" font-size="12" fill="#e2e8f0">localStorage</text>
    <text x="210" y="220" font-size="11" fill="#DD0031">✗ 不存在</text>
    <text x="360" y="220" font-size="11" fill="#34d399">✓ 可用</text>

    <text x="36" y="244" font-size="12" fill="#e2e8f0">首屏数据</text>
    <text x="210" y="244" font-size="11" fill="#fbbf24">请求一次</text>
    <text x="360" y="244" font-size="11" fill="#34d399">TransferState 复用</text>

    <text x="36" y="268" font-size="12" fill="#e2e8f0">事件绑定</text>
    <text x="210" y="268" font-size="11" fill="#94a3b8">仅 HTML</text>
    <text x="360" y="268" font-size="11" fill="#34d399">水合后接管</text>

    <!-- Summary -->
    <rect x="24" y="286" width="524" height="58" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="58" rx="2" fill="#f472b6"/>
    <text x="40" y="306" font-size="12.5" fill="#e2e8f0">withEventReplay() 缓存水合前事件；</text>
    <text x="40" y="326" font-size="12.5" fill="#94a3b8">随机数、时间、DOM 尺寸要先固定再渲染。</text>
  </g>

  <!-- Panel 4: 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：让两端算同一结果</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">服务端与浏览器算同一结果，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">水合才只是一次接管。</text>

    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">模块级缓存请求状态 → 跨请求串数据</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">构造函数读 window → 服务端直接崩</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">随机值/当前时间直出 → 两端不一致闪烁</text>

    <!-- 码叔总结 -->
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">SSR 不是加速器，是「两端一致」的工程约束。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.16</text>
</svg>
