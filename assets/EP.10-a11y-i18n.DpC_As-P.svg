<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <!-- Header -->
  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.10</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">让所有人都能用</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Panel 1: 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：读屏读不出按钮</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">只写了一个图标按钮，屏幕阅读器</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">读出来就是「按钮」两个字？</text>

    <!-- Code chip -->
    <rect x="24" y="152" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 反例：aria-label 没跟上可见文本</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">&lt;button (click)="save()"&gt;</text>
    <text x="46" y="212" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  &lt;svg icon="save" /&gt;  ← 读屏这里断了</text>
    <text x="38" y="232" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">&lt;/button&gt;</text>
    <text x="38" y="250" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 修正：aria-label 让所有用户都读得到</text>

    <!-- 底部总结 -->
    <rect x="24" y="264" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="264" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="286" font-size="13.5" fill="#e2e8f0">aria-label / aria-describedby / aria-live —— 这些属性</text>
    <text x="40" y="306" font-size="13.5" fill="#94a3b8">不是"可选功能"，而是读屏用户的全部信息。</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">焦点是键盘用户的坐标。</text>
  </g>

  <!-- Panel 2: 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：signal 驱动语言切换</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">语言状态就是一个 signal，模板里</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">t() 会读 locale()，自动建立依赖。</text>

    <!-- Code chips -->
    <rect x="32" y="150" width="508" height="42" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="168" font-size="12.5" font-weight="bold" fill="#22d3ee">运行时词典</text>
    <text x="120" y="168" font-size="12" fill="#94a3b8">↓ 即时切换，所有语言进包</text>
    <text x="46" y="186" font-size="12.5" fill="#f472b6">locale = signal('zh'); t(key) =&gt; DICT[locale()][key]</text>

    <rect x="32" y="200" width="508" height="42" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="46" y="218" font-size="12.5" font-weight="bold" fill="#a78bfa">内置 $localize</text>
    <text x="130" y="218" font-size="12" fill="#94a3b8">↓ 构建期抽取，各语言独立产物</text>
    <text x="46" y="236" font-size="12.5" fill="#f472b6">i18n="@@home.title" + ICU 复数格式</text>

    <rect x="32" y="250" width="508" height="42" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="46" y="268" font-size="12.5" font-weight="bold" fill="#f472b6">aria-live</text>
    <text x="110" y="268" font-size="12" fill="#94a3b8">↓ 状态播报，常驻容器 + polite</text>
    <text x="46" y="286" font-size="12.5" fill="#f472b6">&lt;p role="status" aria-live="polite"&gt;{{ i18n.t('saved') }}&lt;/p&gt;</text>

    <rect x="24" y="298" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="298" width="4" height="44" rx="2" fill="#a78bfa"/>
    <text x="40" y="318" font-size="13.5" fill="#e2e8f0">两种路线按切换时机选：即时=运行时词典，</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">SEO=内置 i18n。aria-* 属性跟着一起刷新。</text>
  </g>

  <!-- Panel 3: 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：三语对照 + RTL</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">同一组件切换三语，数字和日期</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">交给 Intl，不手拼格式。</text>

    <!-- Language cards -->
    <rect x="32" y="150" width="168" height="178" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="116" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">🇨🇳 中文</text>
    <line x1="44" y1="178" x2="188" y2="178" stroke="#22d3ee" stroke-opacity="0.2"/>
    <text x="46" y="200" font-size="12.5" fill="#e2e8f0">已保存</text>
    <text x="46" y="218" font-size="11" fill="#94a3b8">¥ 699.00</text>
    <text x="46" y="234" font-size="11" fill="#94a3b8">2026/10/22</text>
    <text x="46" y="258" font-size="10" fill="#34d399">◀ Tab 可聚焦</text>
    <text x="46" y="274" font-size="10" fill="#34d399">aria-pressed 选中态可见</text>

    <rect x="204" y="150" width="168" height="178" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="288" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#a78bfa">🇺🇸 English</text>
    <line x1="216" y1="178" x2="360" y2="178" stroke="#a78bfa" stroke-opacity="0.2"/>
    <text x="218" y="200" font-size="12.5" fill="#e2e8f0">Saved</text>
    <text x="218" y="218" font-size="11" fill="#94a3b8">$ 699.00</text>
    <text x="218" y="234" font-size="11" fill="#94a3b8">10/22/2026</text>
    <text x="218" y="258" font-size="10" fill="#34d399">Same structure, different text</text>
    <text x="218" y="274" font-size="10" fill="#34d399">Signal-driven auto refresh</text>

    <rect x="376" y="150" width="168" height="178" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="460" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">🇸🇦 العربية (RTL)</text>
    <line x1="388" y1="178" x2="532" y2="178" stroke="#f472b6" stroke-opacity="0.2"/>
    <text x="532" y="200" text-anchor="end" font-size="12.5" fill="#e2e8f0">تم الحفظ</text>
    <text x="532" y="218" text-anchor="end" font-size="11" fill="#94a3b8">٦٩٩٫٠٠ ر.س</text>
    <text x="532" y="234" text-anchor="end" font-size="11" fill="#94a3b8">٢٢/١٠/٢٠٢٦</text>
    <text x="532" y="258" text-anchor="end" font-size="10" fill="#34d399">▶ RTL layout auto-flipped</text>
    <text x="532" y="274" text-anchor="end" font-size="10" fill="#34d399">dir="rtl" mirrors layout</text>
  </g>

  <!-- Panel 4: 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：a11y + i18n 最佳实践</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">可见文本、aria-* 属性、焦点状态——</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">三种用户，一套词典。</text>

    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">只翻译可见文本不翻译 aria-label，读屏还朗读旧语言</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">关闭对话框没归还焦点，Esc 后键盘用户迷失位置</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">aria-live 容器随条件创建，部分读屏错过首次播报</text>

    <!-- 码叔总结 -->
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">signal 驱动语言切换，焦点成对归还，aria-live 常驻容器。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.10</text>
</svg>
