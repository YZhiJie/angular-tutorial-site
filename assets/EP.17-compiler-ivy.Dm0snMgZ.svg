<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <!-- Header -->
  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.17</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">模板编译两遍</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Panel 1: 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：模板错误来得太晚</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="440" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">模板里属性写错，构建才报；</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">Angular 真的是虚拟 DOM 吗？</text>

    <!-- Code chip -->
    <rect x="24" y="152" width="524" height="96" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">@for (item of items; track item.id) {</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  &lt;li [titl]="item.name"&gt;{{ item.name }}&lt;/li&gt;</text>
    <text x="38" y="214" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="236" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 少写 track 或拼错 titl，编译期直接失败</text>

    <!-- 底部总结 -->
    <rect x="24" y="264" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="264" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="286" font-size="13.5" fill="#e2e8f0">Angular 不是运行时解释模板，</text>
    <text x="40" y="306" font-size="13.5" fill="#94a3b8">而是把模板先编译成指令；</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">很多错误因此被提前到构建期。</text>
  </g>

  <!-- Panel 2: 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：编译的四步</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">模板不是字符串，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">是一段会被生成的指令。</text>

    <!-- Four steps -->
    <rect x="32" y="148" width="508" height="38" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="166" font-size="12.5" font-weight="bold" fill="#22d3ee">① parse</text>
    <text x="390" y="166" font-size="12.5" fill="#e2e8f0">HTML → AST</text>
    <text x="46" y="180" font-size="11" fill="#475569">识别元素、属性、绑定与结构指令</text>

    <rect x="32" y="194" width="508" height="38" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="46" y="212" font-size="12.5" font-weight="bold" fill="#a78bfa">② bind</text>
    <text x="390" y="212" font-size="12.5" fill="#e2e8f0">AST → 语义节点</text>
    <text x="46" y="226" font-size="11" fill="#475569">属性、事件、输入输出、依赖</text>

    <rect x="32" y="240" width="508" height="38" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="46" y="258" font-size="12.5" font-weight="bold" fill="#f472b6">③ TCB</text>
    <text x="390" y="258" font-size="12.5" fill="#e2e8f0">模板类型检查</text>
    <text x="46" y="272" font-size="11" fill="#475569">属性名、类型、上下文变量都在这查</text>

    <rect x="32" y="286" width="508" height="38" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="46" y="304" font-size="12.5" font-weight="bold" fill="#f97316">④ emit</text>
    <text x="390" y="304" font-size="12.5" fill="#e2e8f0">生成 ɵɵelementStart...</text>
    <text x="46" y="318" font-size="11" fill="#475569">每个组件一份 ComponentDef</text>
  </g>

  <!-- Panel 3: 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：渲染器到底存了什么</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="440" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">浏览器里没有虚拟 DOM 树，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">只有指令与 LView。</text>

    <!-- Code -->
    <rect x="24" y="152" width="524" height="108" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 编译产物（示意）</text>
    <text x="38" y="194" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">ɵɵelementStart(0, "li");</text>
    <text x="38" y="214" font-size="12" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">ɵɵtext(1);</text>
    <text x="38" y="234" font-size="12" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">ɵɵelementEnd();</text>
    <text x="38" y="254" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 运行时按指令增量更新真实 DOM</text>

    <rect x="24" y="272" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="272" width="4" height="72" rx="2" fill="#f472b6"/>
    <text x="40" y="294" font-size="13" fill="#e2e8f0">signal 依赖图按需计算：</text>
    <text x="40" y="314" font-size="13" fill="#94a3b8">producer 变化 → 只标记消费者；</text>
    <text x="40" y="334" font-size="13" fill="#94a3b8">读取时才求值，并自动缓存结果。</text>
  </g>

  <!-- Panel 4: 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：用编译期换运行时</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">把类型检查、结构展开、</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">依赖追踪都前移。</text>

    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">@for 不写 track → 编译期直接报错</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">用 any 绕开模板类型 → TCB 白做</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">在模板里做重计算 → 每次变更都重跑</text>

    <!-- 码叔总结 -->
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">编译期越严格，运行时越轻；signal 让依赖可追踪。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.17</text>
</svg>
