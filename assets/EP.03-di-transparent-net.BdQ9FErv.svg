<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.03</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">DI 那张透明网</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- 第一格 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：两个面板不联动</text>
    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,-3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">CounterPanel +10，LogPanel 没变？</text>
    <text x="102" y="126" font-size="15" fill="#DD0031">各自拿到了不同实例…哪个作用域出问题？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// ❌ 组件 providers 各持一份实例</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">@Component({ providers: [CounterStore] })</text>
    <text x="38" y="214" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// ✅ 根级单例，全局共享</text>
    <text x="38" y="232" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">@Injectable({ providedIn: 'root' })</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">同一个 Service 在谁那注册，就有几份实例。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">共享状态用 providedIn: 'root'。</text>
  </g>

  <!-- 第二格 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：DI 查找链三步</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">host → parent → root，找得到就停。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">providedIn 决定第一次创建在哪。</text>
    <!-- 三步查找链图示 -->
    <rect x="24" y="150" width="160" height="56" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="104" y="172" text-anchor="middle" font-size="12" fill="#a78bfa" font-weight="bold">① host 组件</text>
    <text x="104" y="192" text-anchor="middle" font-size="11" fill="#94a3b8">自己的 providers</text>
    <rect x="206" y="150" width="160" height="56" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="286" y="172" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="bold">② 父级链</text>
    <text x="286" y="192" text-anchor="middle" font-size="11" fill="#94a3b8">逐个向上</text>
    <rect x="388" y="150" width="160" height="56" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="468" y="172" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="bold">③ root 注入器</text>
    <text x="468" y="192" text-anchor="middle" font-size="11" fill="#94a3b8">根级单例</text>
    <text x="296" y="216" text-anchor="middle" font-size="12" fill="#94a3b8">↓ 找不到才继续 ↑</text>
    <rect x="24" y="230" width="524" height="72" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="252" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// inject 必须在注入上下文调用</text>
    <text x="38" y="272" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">store = inject(CounterStore);</text>
    <text x="38" y="290" font-size="12" fill="#f97316" font-family="'SF Mono',Consolas,monospace">// ❌ 放到 setTimeout 里会报错</text>
    <rect x="24" y="310" width="524" height="30" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="310" width="4" height="30" rx="2" fill="#a78bfa"/>
    <text x="40" y="330" font-size="13.5" fill="#e2e8f0">字段初始化器 / 构造函数 / 工厂函数都是注入上下文。</text>
  </g>

  <!-- 第三格 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：InjectionToken 加 optional</text>
    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">非类依赖（配置、常量）怎么办？</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">InjectionToken 加 optional。</text>
    <rect x="24" y="150" width="524" height="148" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 1. 定义令牌</text>
    <text x="38" y="190" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">LOGGER_PREFIX = new InjectionToken&lt;string&gt;(</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  '日志前缀');</text>
    <text x="38" y="226" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 2. 应用级注册</text>
    <text x="38" y="244" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">providers: [{ provide: LOGGER_PREFIX,</text>
    <text x="38" y="260" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  useValue: '[演示]' }]</text>
    <text x="38" y="280" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 3. 消费时 optional + 兜底</text>
    <text x="38" y="296" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">inject(LOGGER_PREFIX, { optional: true }) ?? '[app]'</text>
    <rect x="24" y="312" width="524" height="30" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="312" width="4" height="30" rx="2" fill="#f472b6"/>
    <text x="40" y="332" font-size="13.5" fill="#e2e8f0">令牌缺失时返回 null 而不是 NullInjectorError。</text>
  </g>

  <!-- 第四格 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：DI 透明网最佳实践</text>
    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">服务内用私有 signal + asReadonly 暴露。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">write 方法收敛在服务内部。</text>
    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">多个面板状态不同步 → 在共同父级或 root 提供，别重复 providers</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">NullInjectorError → InjectionToken 没注册，加 optional + 默认值</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">数组 push 后界面不变 → 用 update 返回新引用</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">providers 决定作用域，inject 决定依赖。别 new Service()。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.03</text>
</svg>
