<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <!-- Header -->
  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.14</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">表单的三件武器</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <!-- Panel 1: 左上 · 困境 -->
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：数组与控件不听话</text>

    <!-- 标签君头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">手机号想加几个就加几个，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">密码还要自定义强度控件。</text>

    <!-- Code chip -->
    <rect x="24" y="152" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 错：直接改底层数组，校验与脏值不更新</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">form.controls.phones.value.push('');</text>
    <text x="38" y="214" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 对：走 FormArray API</text>
    <text x="38" y="234" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">form.controls.phones.push(fb.control(''));</text>

    <!-- 底部总结 -->
    <rect x="24" y="264" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="264" width="4" height="72" rx="2" fill="#22d3ee"/>
    <text x="40" y="286" font-size="13.5" fill="#e2e8f0">FormArray 不是普通数组，</text>
    <text x="40" y="306" font-size="13.5" fill="#94a3b8">每个元素都是独立控件；</text>
    <text x="40" y="326" font-size="13.5" fill="#94a3b8">增删必须走 push / removeAt。</text>
  </g>

  <!-- Panel 2: 右上 · 揭秘 -->
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三件武器各有什么协议</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">三件武器各有协议，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">别用数组思维对待控件。</text>

    <!-- Three tools -->
    <rect x="32" y="150" width="508" height="52" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="170" font-size="13" font-weight="bold" fill="#22d3ee">FormArray</text>
    <text x="46" y="190" font-size="12" fill="#94a3b8">push / removeAt / at(i)，每个下标是独立控件</text>

    <rect x="32" y="210" width="508" height="52" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="46" y="230" font-size="13" font-weight="bold" fill="#a78bfa">ControlValueAccessor</text>
    <text x="46" y="250" font-size="12" fill="#94a3b8">writeValue / onChange / onTouched / setDisabledState</text>

    <rect x="32" y="270" width="508" height="52" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="46" y="290" font-size="13" font-weight="bold" fill="#f472b6">AsyncValidator</text>
    <text x="46" y="310" font-size="12" fill="#94a3b8">同步先过 → 异步 PENDING → VALID / INVALID</text>
  </g>

  <!-- Panel 3: 左下 · 实证 -->
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：校验顺序与待定态</text>

    <!-- 像素酱头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="430" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">异步校验没结束时，控件不是 VALID，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">而是 PENDING。</text>

    <!-- Validation order -->
    <rect x="32" y="150" width="508" height="178" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="46" y="172" font-size="12.5" fill="#94a3b8">值变化</text>
    <line x1="120" y1="168" x2="190" y2="168" stroke="#22d3ee" stroke-width="1.5"/>
    <polygon points="196,168 188,164 188,172" fill="#22d3ee"/>
    <rect x="200" y="154" width="140" height="28" rx="7" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="270" y="173" text-anchor="middle" font-size="12" fill="#22d3ee">同步校验器</text>
    <text x="356" y="173" font-size="12" fill="#94a3b8">失败 → INVALID</text>

    <line x1="270" y1="198" x2="270" y2="220" stroke="#a78bfa" stroke-width="1.5"/>
    <polygon points="270,226 266,218 274,218" fill="#a78bfa"/>
    <rect x="200" y="212" width="140" height="28" rx="7" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="270" y="231" text-anchor="middle" font-size="12" fill="#a78bfa">异步校验器</text>

    <rect x="40" y="254" width="140" height="24" rx="6" fill="#0e1730" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="110" y="270" text-anchor="middle" font-size="11" fill="#fbbf24">等待 → PENDING</text>
    <rect x="200" y="254" width="140" height="24" rx="6" fill="#0e1730" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="270" y="270" text-anchor="middle" font-size="11" fill="#34d399">通过 → VALID</text>
    <rect x="360" y="254" width="160" height="24" rx="6" fill="#0e1730" stroke="#DD0031" stroke-opacity="0.6"/>
    <text x="440" y="270" text-anchor="middle" font-size="11" fill="#DD0031">失败 → INVALID</text>

    <text x="46" y="304" font-size="12" fill="#94a3b8">提示：updateOn: 'blur' 或防抖，避免每次按键都发请求。</text>
    <text x="46" y="322" font-size="12" fill="#94a3b8">pending 时不要显示「可用」，也不要禁用整个表单。</text>
  </g>

  <!-- Panel 4: 右下 · 结案 -->
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：让模型可推理</text>

    <!-- 码叔头像 -->
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#f1f5f9"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-6,7 q12,9 0,16 q-4,0 -6,-16 z" fill="#f1f5f9"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="420" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">控件协议、待定状态、跨字段校验，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">都要让模型可推理。</text>

    <!-- 坑点标签 -->
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">直接改 FormArray 底层数组 → 校验与脏值不更新</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">把 pending 当 valid → 未校验就允许提交</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">跨字段规则挂到单字段 → 更新顺序产生假阴性</text>

    <!-- 码叔总结 -->
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">FormArray 管结构，CVA 管协议，异步校验管时机。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.14</text>
</svg>
