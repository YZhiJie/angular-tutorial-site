<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD0031"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg5)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#DD0031" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#DD0031"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.05</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad5)">Signal 就是信号枪</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Angular 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad5)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：模板没刷新</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#3b82f6"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="420" height="62" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">我改了 total 字段，模板还是旧数字！</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">哦…原来它不是 signal</text>
    <rect x="24" y="152" width="524" height="114" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 错误：total 是普通字段</text>
    <text x="38" y="194" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">class Cart { total = 0 }</text>
    <text x="38" y="216" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 正确：signal + computed</text>
    <text x="38" y="234" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">const price = signal(199);</text>
    <text x="38" y="252" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">const total = computed(</text>
    <text x="38" y="268" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  () =&gt; price() * qty());</text>
    <rect x="24" y="282" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="56" rx="2" fill="#22d3ee"/>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">普通字段不会通知调度器；signal 才是刷新通道。</text>
    <text x="40" y="324" font-size="13.5" fill="#94a3b8">写入 .set() / .update() 才触发模板重新求值。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：四管齐发</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="360" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">computed 自动跟踪依赖、</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">effect 自动订阅、linkedSignal 可写可跟随</text>
    <rect x="32" y="140" width="120" height="40" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="158" font-size="11.5" font-weight="bold" fill="#22d3ee">signal(199)</text>
    <text x="46" y="174" font-size="10" fill="#94a3b8">唯一写入入口</text>
    <rect x="162" y="140" width="120" height="40" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="176" y="158" font-size="11.5" font-weight="bold" fill="#a78bfa">computed(...)</text>
    <text x="176" y="174" font-size="10" fill="#94a3b8">惰性 + 缓存</text>
    <rect x="292" y="140" width="120" height="40" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="306" y="158" font-size="11.5" font-weight="bold" fill="#f472b6">effect(...)</text>
    <text x="306" y="174" font-size="10" fill="#94a3b8">自动订阅副作用</text>
    <rect x="422" y="140" width="120" height="40" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="436" y="158" font-size="11.5" font-weight="bold" fill="#f97316">linkedSignal(...)</text>
    <text x="436" y="174" font-size="10" fill="#94a3b8">可写可跟随</text>
    <rect x="24" y="194" width="524" height="86" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="216" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// linkedSignal：草稿可临时偏离</text>
    <text x="38" y="234" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">const draft = linkedSignal(</text>
    <text x="38" y="250" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  () =&gt; quantity());</text>
    <text x="38" y="268" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">draft.set(7); // 合法写入</text>
    <rect x="24" y="288" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="50" rx="2" fill="#a78bfa"/>
    <text x="40" y="309" font-size="13.5" fill="#e2e8f0">依赖图是自动建的：读 signal 时登记，写 signal 时通知。</text>
    <text x="40" y="327" font-size="13.5" fill="#94a3b8">模板 / computed / effect 都是惰性求值，只有写入才触发。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：触发顺序</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#DD0031"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="320" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">signal.set() 触发的时间线：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">set → scheduler → computed/effect → 模板</text>
    <rect x="32" y="140" width="246" height="28" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="46" y="158" font-size="12" font-weight="bold" fill="#22d3ee">① price.set(299)</text>
    <text x="190" y="158" font-size="11" fill="#94a3b8">  写入入口</text>
    <rect x="32" y="174" width="246" height="28" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="46" y="192" font-size="12" font-weight="bold" fill="#fbbf24">② 调度器标记依赖者</text>
    <text x="218" y="192" font-size="11" fill="#94a3b8">  仅标记不执行</text>
    <rect x="32" y="208" width="246" height="28" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="46" y="226" font-size="12" font-weight="bold" fill="#a78bfa">③ total (computed) 重算</text>
    <text x="222" y="226" font-size="11" fill="#94a3b8">  惰性缓存失效</text>
    <rect x="32" y="242" width="246" height="28" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="46" y="260" font-size="12" font-weight="bold" fill="#f472b6">④ effect 同步日志</text>
    <text x="186" y="260" font-size="11" fill="#94a3b8">  副作用执行</text>
    <rect x="32" y="276" width="246" height="28" rx="8" fill="#111a30" stroke="#DD0031" stroke-opacity="0.5"/>
    <text x="46" y="294" font-size="12" font-weight="bold" fill="#DD0031">⑤ 模板读取刷新</text>
    <text x="190" y="294" font-size="11" fill="#94a3b8">  DOM 更新</text>
    <rect x="290" y="140" width="258" height="164" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="304" y="162" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// effect 读写分离</text>
    <text x="304" y="182" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">effect(() =&gt; {</text>
    <text x="304" y="200" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  const s = total() + ' 元';</text>
    <text x="304" y="218" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  log.update(l =&gt; [...l, s]);</text>
    <text x="304" y="236" font-size="11.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">});</text>
    <text x="304" y="258" font-size="10.5" fill="#e2e8f0">✓ 读 total, 写 log 不回环</text>
    <text x="304" y="278" font-size="10.5" fill="#f472b6">✗ 别读了 log 又写 log</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：信号枪守则</text>
    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#e2e8f0"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#DD0031"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="400" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="102" font-size="15" fill="#0b1220">best practice：源信号唯一，派生全靠 computed</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">effect 只做同步副作用，别写回环</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">修改对象属性后页面不更新——用 set/update 产生新值</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">computed 不会主动推值——模板不读就永远不计算</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">effect 读写同一个 signal——会形成无限回环</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#DD0031"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#DD0031">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">把普通字段升级成 signal，用 computed 建依赖图。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · angular-tutorial · EP.05</text>
</svg>
